<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Fit Workbench</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app-header">
  <h1>Career Fit Workbench <span class="version">v0.1</span></h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="add">求人を追加</button>
    <button class="tab-btn" data-tab="list">一覧</button>
  </nav>
</header>

<main>
  <section id="tab-add" class="tab-panel active">
    <div id="dropzone" class="dropzone">
      <p>求人のスクリーンショットをここへドラッグ＆ドロップ</p>
      <p class="hint">同じ求人なら何枚でも一緒に投入してください（枚数制限なし）</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <button id="pickFilesBtn" type="button">ファイルを選択</button>
    </div>
    <div id="stagedImages" class="staged-images"></div>
    <button id="analyzeBtn" type="button" disabled>この求人を解析する</button>

    <div id="analyzeStatus" class="status-line" hidden></div>

    <div id="resultCard" class="result-card" hidden></div>
  </section>

  <section id="tab-list" class="tab-panel">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="a-only">Aのみ</button>
      <button class="filter-btn" data-filter="a-b">A+B</button>
      <button class="filter-btn" data-filter="fully-remote">Fully Remote</button>
      <button class="filter-btn" data-filter="income600">年収600万円以上</button>
      <button class="filter-btn" data-filter="candidate">応募候補</button>
      <button class="filter-btn" data-filter="missing-info">情報不足</button>
      <button class="filter-btn" data-filter="hide-pass">見送り非表示</button>
    </div>
    <div id="jobList" class="job-list"></div>
    <p id="jobListEmpty" class="empty-hint" hidden>まだ保存された求人がありません。「求人を追加」タブからどうぞ。</p>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
