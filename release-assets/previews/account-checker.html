<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アカウント確認記録ツール</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17212b;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:64px 56px}.eyebrow{color:#7c3aed;font-weight:800;letter-spacing:.12em}.top{display:flex;justify-content:space-between;align-items:end}.badge{background:#ede9fe;color:#6d28d9;border-radius:999px;padding:8px 15px;font-weight:800}h1{font-size:46px;margin:8px 0 14px}.lead{color:#64748b;font-size:19px}.panel{margin-top:36px;background:#fff;border:1px solid #dbe3ea;border-radius:18px;padding:28px;box-shadow:0 16px 40px #1e293b12}.account{font-size:22px;font-weight:900}.url{margin-top:8px;color:#475569;font-family:ui-monospace,monospace}.summary{margin:22px 0;padding:18px;background:#f8fafc;border-radius:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border:1px solid #e2e8f0;border-radius:12px;padding:16px}.metric b{display:block;font-size:25px}.metric span{color:#64748b}.safe{margin-top:22px;color:#166534;font-weight:700}.foot{margin-top:28px;color:#64748b;font-size:14px}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">PUBLIC ACCOUNT OBSERVATION</div><h1>アカウント確認記録ツール</h1><div class="lead">公開投稿の確認結果だけを、必要最小限に記録。</div></div><div class="badge">ローカル保存</div></div><section class="panel"><div class="account">@example_account</div><div class="url">https://x.com/example_account/status/123</div><div class="summary">公開投稿の短い要約を記録したサンプルです。</div><div class="metrics"><div class="metric"><b>100</b><span>表示</span></div><div class="metric"><b>5</b><span>いいね</span></div><div class="metric"><b>1</b><span>リポスト</span></div><div class="metric"><b>0</b><span>返信</span></div></div><div class="safe">✓ DM・非公開投稿・ログイン情報は取得しません</div></section><div class="foot">一般配布版・匿名サンプル　公開画面を人が確認して記録</div></main></body></html>
