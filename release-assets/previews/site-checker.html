<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サイト差分チェッカー</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17212b;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:64px 56px}.eyebrow{color:#2563eb;font-weight:800;letter-spacing:.12em}.top{display:flex;justify-content:space-between;align-items:end}.badge{background:#dcfce7;color:#166534;border-radius:999px;padding:8px 15px;font-weight:800}h1{font-size:48px;margin:8px 0 14px}.lead{color:#64748b;font-size:19px}.panel{margin-top:36px;background:#fff;border:1px solid #dbe3ea;border-radius:18px;padding:28px;box-shadow:0 16px 40px #1e293b12}.row{display:grid;grid-template-columns:140px 1fr 180px;gap:20px;align-items:center;padding:18px;border-bottom:1px solid #e7edf3}.row:last-child{border:0}.state{font-weight:900}.unchanged{color:#166534}.baseline{color:#1d4ed8}.url{font-family:ui-monospace,monospace}.time{color:#64748b}.note{margin-top:22px;background:#eef4ff;border-radius:12px;padding:16px 20px;color:#334155}.foot{margin-top:28px;color:#64748b;font-size:14px}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">PUBLIC SITE CHANGE CHECK</div><h1>サイト差分チェッカー</h1><div class="lead">公開ページの変化を、PC内で静かに確認。</div></div><div class="badge">確認完了</div></div><section class="panel"><div class="row"><div class="state unchanged">unchanged</div><div class="url">https://example.org/</div><div class="time">08:55 確認</div></div><div class="row"><div class="state baseline">baseline</div><div class="url">https://example.org/news</div><div class="time">08:55 初回記録</div></div><div class="note">変化の有無だけを記録します。内容の意味、人物の意図、医学的妥当性は自動判定しません。</div></section><div class="foot">一般配布版・匿名サンプル　設定と確認結果はローカル保存</div></main></body></html>
