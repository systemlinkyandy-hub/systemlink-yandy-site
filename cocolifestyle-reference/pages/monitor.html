<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公開差分チェック</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header>
    <p class="eyebrow">PUBLIC CHANGE MONITOR</p>
    <h1>公開差分チェック</h1>
    <p>公開サイトと公開アカウントについて、確認できた事実だけを記録します。人物の意図・悪意・診療上の正否は判定しません。</p>
    <p><a href="../index.html">← 主張カードへ戻る</a></p>
  </header>
  <main>
    <aside class="warning"><strong>確認範囲には限界があります。</strong> 非公開・削除済み・ログイン状態でのみ表示される投稿や反応は含みません。表示数等は確認時点の値です。</aside>
    <p id="summary" aria-live="polite"></p>
    <section id="observations" class="cards"></section>
  </main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const metricText=m=>m?Object.entries(m).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join(' · '):'記録なし';
    fetch('../data/public-monitor.json').then(r=>r.json()).then(d=>{
      document.querySelector('#summary').innerHTML=`<strong>確認日時：</strong>${esc(d.checkedAt)}<br><strong>公開上の個人特定言及：</strong>${d.overall.publicTargetingObserved?'確認あり':'確認なし'}<br><strong>反応拡大：</strong>${d.overall.viralSpreadObserved?'確認あり':'確認なし'}<br>${esc(d.overall.note)}`;
      document.querySelector('#observations').innerHTML=d.observations.map(x=>`<article class="card"><span class="tag unresolved">${esc(x.kind)}</span><h2>${esc(x.summary)}</h2><p class="meta">確認：${esc(x.observedAt)}<br>個人特定言及：${x.identifiableReference?'あり':'なし'}<br>${metricText(x.metrics)}</p><p><a href="${esc(x.url)}" target="_blank" rel="noreferrer">公開URL</a></p></article>`).join('');
    }).catch(()=>document.querySelector('#observations').innerHTML='<p>記録を読み込めません。READMEのローカルサーバー手順で開いてください。</p>');
  </script>
</body>
</html>
