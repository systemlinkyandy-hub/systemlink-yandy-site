<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>cocolifestyle 研究整理（ローカル）</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header><p class="eyebrow">LOCAL / RESEARCH REFERENCE</p><h1>主張と根拠を、混ぜずに読む。</h1><p>cocolifestyle.net の公開情報を、文献知見・運営者の解釈・個人体験・未検証に分離したローカル索引です。</p></header>
  <aside class="warning"><strong>治療決定には使用しないでください。</strong> これは比較・研究参照用の初版です。服薬、減薬、シックデイ対応は主治医と確認してください。</aside>
  <main>
    <section class="controls" aria-label="検索と絞り込み">
      <input id="search" type="search" placeholder="キーワード、薬剤、疾患、出典…">
      <select id="type"><option value="">全分類</option><option value="literature">文献で確認</option><option value="interpretation">著者の解釈</option><option value="experience">個人体験</option><option value="unresolved">未検証・適用注意</option></select>
      <select id="status"><option value="">全照合状態</option><option value="verified">原典照合済み</option><option value="partial">部分照合</option><option value="unverified">未照合</option></select>
    </section>
    <section class="legend"><span class="literature">青：文献</span><span class="interpretation">黄：解釈</span><span class="experience">緑：個人体験</span><span class="unresolved">灰：未検証・注意</span></section>
    <p id="count" aria-live="polite"></p>
    <section id="cards" class="cards"></section>
  </main>
  <footer>調査日: 2026-08-09 · 対象本文の大量転載はせず、要約とリンクで構成 · DIRECT / NO ARC</footer>
  <script src="assets/app.js"></script>
</body>
</html>
