<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出典・照合ログ</title><link rel="stylesheet" href="../assets/style.css"></head><body><header><p class="eyebrow">AUDIT LOG</p><h1>出典・照合ログ</h1><p><a href="../index.html">← 主張カードへ戻る</a></p></header><main><div style="overflow:auto"><table><thead><tr><th>ID</th><th>原典／資料</th><th>関係</th><th>照合位置</th><th>確認内容</th><th>確認日</th></tr></thead><tbody id="log"></tbody></table></div></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rel={direct:'直接根拠',indirect:'関連資料',candidate:'候補資料'};fetch('../data/claims.json').then(r=>r.json()).then(d=>document.querySelector('#log').innerHTML=d.map(c=>`<tr><td>${e(c.id)}</td><td>${e(c.sourceTitle||'―')} (${e(c.sourceYear||'―')})</td><td>${e(rel[c.sourceRelation]||'―')}</td><td>${e(c.sourceLocator||'未特定')}</td><td>${e(c.verificationNote)}</td><td>${e(c.checkedAt||'未確認')}</td></tr>`).join(''));</script></body></html>
